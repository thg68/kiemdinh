name: Production quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-anon-key
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase and apply every migration
        run: npx supabase start
      - name: Verify clean migration replay
        run: npx supabase db reset
      - name: Run pgTAP RLS and transaction tests
        run: npm run test:rls
      - if: always()
        run: npx supabase stop --no-backup

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [application, database-security]
    timeout-minutes: 20
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.STAGING_APP_URL }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Keep pull requests on the stable staging deployment
        if: github.event_name == 'pull_request'
        run: echo "Pull request tests use the current staging deployment."
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: github.event_name != 'pull_request'
      - run: npm run deploy:staging
        if: github.event_name != 'pull_request'

  e2e-staging:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    timeout-minutes: 20
    environment: staging
    env:
      CI: "true"
      E2E_BASE_URL: ${{ secrets.STAGING_APP_URL }}
      E2E_PRINCIPAL_EMAIL: ${{ secrets.E2E_PRINCIPAL_EMAIL }}
      E2E_PRINCIPAL_PASSWORD: ${{ secrets.E2E_PRINCIPAL_PASSWORD }}
      E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
      E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
      E2E_YEAR_ID: ${{ secrets.E2E_YEAR_ID }}
      E2E_CAP_HOC: ${{ vars.E2E_CAP_HOC }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
