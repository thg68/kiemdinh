name: Production quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase and apply every migration
        run: npx supabase start
      - name: Verify clean migration replay
        run: npx supabase db reset
      - name: Run pgTAP RLS and transaction tests
        run: npm run test:rls
      - if: always()
        run: npx supabase stop --no-backup

  e2e-staging:
    runs-on: ubuntu-latest
    needs: [application, database-security]
    timeout-minutes: 20
    env:
      CI: "true"
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_PRINCIPAL_EMAIL: ${{ secrets.E2E_PRINCIPAL_EMAIL }}
      E2E_PRINCIPAL_PASSWORD: ${{ secrets.E2E_PRINCIPAL_PASSWORD }}
      E2E_SECRETARY_EMAIL: ${{ secrets.E2E_SECRETARY_EMAIL }}
      E2E_SECRETARY_PASSWORD: ${{ secrets.E2E_SECRETARY_PASSWORD }}
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
      E2E_YEAR_ID: ${{ secrets.E2E_YEAR_ID }}
      E2E_CAP_HOC: ${{ vars.E2E_CAP_HOC }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
